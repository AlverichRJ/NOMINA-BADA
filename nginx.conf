# ============================================================
# Configuración de Nginx para Sistema de Asistencias
# ============================================================
# Instalación:
#   sudo cp nginx.conf /etc/nginx/sites-available/asistencias
#   sudo ln -s /etc/nginx/sites-available/asistencias /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    # Cambiar por tu IP o dominio:
    server_name 192.168.10.73;
    # Si tienes dominio: server_name sistemabadabun.com www.sistemabadabun.com;

    # Logs
    access_log /var/log/nginx/asistencias_access.log;
    error_log  /var/log/nginx/asistencias_error.log;

    # Tamaño máximo de archivos subidos (para importar CSV/Excel)
    client_max_body_size 50M;

    # Servir archivos de uploads directamente (más eficiente que Node.js)
    location /uploads/ {
        alias /var/www/asistencias/uploads/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        # Seguridad: no ejecutar scripts en uploads
        location ~* \.(php|py|sh|cgi)$ {
            deny all;
        }
    }

    # Proxy al servidor Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Timeout para operaciones largas (exportar PDF/Excel)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

